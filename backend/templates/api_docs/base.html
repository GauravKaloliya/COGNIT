<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COGNIT API Docs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="docs-root">
  <div class="app app-stage-api">
    <header class="header">
      <div class="brand">
        <h1>C.O.G.N.I.T. API Docs</h1>
        <p class="subtitle">A C.O.G.N.I.T. API which powers C.O.G.N.I.T. website</p>
      </div>

      <div class="header-actions">
        <button
          id="docsThemeToggle"
          class="ghost dark-mode-toggle"
          type="button"
          aria-label="Toggle dark mode"
          title="Switch theme"
        >🌙</button>
      </div>
    </header>

    <div class="docs-layout">
      <div class="docs-sidebar-column stage-section" style="--section-index: 0">
        <div id="docsScrollTitle" class="docs-scroll-title" aria-hidden="true">
          <span>C.O.G.N.I.T. API Docs</span>
        </div>

        <aside class="docs-sidebar" aria-label="API docs sidebar">
          <section class="docs-base-url-box" aria-label="Base URL">
            <p class="sidebar-label">Base URL</p>
            <code class="base-url-pill">{{ base_url }}</code>
          </section>

          <nav class="top-nav docs-side-nav" aria-label="Section navigation">
            <a href="/api-docs/endpoints" {% if active_page == "endpoints" %}class="is-active"{% endif %}>Endpoints</a>
            <a href="/api-docs/errors" {% if active_page == "errors" %}class="is-active"{% endif %}>Errors</a>
            <a href="/api-docs/examples" {% if active_page == "examples" %}class="is-active"{% endif %}>Examples</a>
          </nav>
        </aside>
      </div>

      <main class="docs-main route-transition">
          {% block docs_content %}{% endblock %}
          <div class="branding-footer">C.O.G.N.I.T</div>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='api_docs_header.js') }}"></script>
  {% block docs_scripts %}{% endblock %}
</body>
</html>
