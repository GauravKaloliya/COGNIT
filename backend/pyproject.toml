[project]
name = "cognit-backend"
version = "0.1.0"
description = "Cognitive Image & Text Research Platform - Backend API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask==3.0.2",
    "flask-cors==4.0.0",
    "flask-limiter==3.3.0",
    "psycopg2-binary==2.9.9",
    "SQLAlchemy==2.0.25",
    "python-dotenv==1.0.0",
    "redis>=4.0.0",
    "pillow==10.3.0",
    "qrcode==7.4.2",
    "boto3==1.34.93",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "app*", "middleware*"]
exclude = ["templates*", "*.tests"]

[tool.uv]
dev-dependencies = []
